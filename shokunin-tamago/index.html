<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#140d08">
<meta name="format-detection" content="telephone=no">
<title>職人 ― たまご料理の巨匠</title>
<style>
:root{--gold:#d8b46a;--gold2:#f3dca0;--ink:#f5ecd9;--dim:#bba98a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0d0805}
body{position:fixed;inset:0;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","MS PMincho",serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:radial-gradient(ellipse at 50% 35%,#2a1b11 0%,#0d0805 75%)}
.sans{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif}
#stage{position:absolute;left:0;top:0;width:450px;height:800px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#1b120b;box-shadow:0 0 60px rgba(0,0,0,.8)}
#cv{position:absolute;left:0;top:0;width:450px;height:800px;display:block;touch-action:none}
#layer{position:absolute;left:0;top:0;width:450px;height:800px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{min-height:58px;padding:0 22px;border-radius:12px;border:1px solid rgba(216,180,106,.65);background:linear-gradient(#3b2817,#22160c);color:var(--gold2);font-size:20px;letter-spacing:.14em;box-shadow:0 3px 0 #080502,0 8px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,230,170,.18);display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.btn:active,.btn.down{transform:translateY(2px);box-shadow:0 1px 0 #080502,0 4px 10px rgba(0,0,0,.5)}
.btn.gold{background:linear-gradient(#ecd08e,#b8893f);color:#26170a;border-color:#f7e5b2;font-weight:bold;text-shadow:0 1px 0 rgba(255,245,215,.5)}
.btn.off{opacity:.38;cursor:default}
.btn svg{width:26px;height:26px;flex:none}
.wide{width:320px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(216,180,106,.5);background:rgba(25,16,9,.78);color:var(--gold2);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="false"]{color:#8a7a60;border-color:rgba(140,120,90,.4)}
#snd{position:absolute;right:8px;top:8px;display:flex;gap:8px;z-index:30}
.back{position:absolute;left:10px;top:8px;z-index:5}
.screen{position:absolute;inset:0;display:none;z-index:10}
.screen.on{display:block}
.center{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.head{position:absolute;left:0;right:0;top:66px;text-align:center;font-size:26px;letter-spacing:.4em;color:var(--gold2);text-shadow:0 2px 8px #000}
.rule{width:180px;height:1px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* title */
#scTitle .tt{top:92px;text-shadow:0 4px 18px rgba(0,0,0,.9)}
.tt-s{font-size:22px;letter-spacing:.9em;padding-left:.9em;color:var(--gold)}
.tt-m{font-size:104px;font-weight:600;letter-spacing:.12em;padding-left:.12em;line-height:1.1;background:linear-gradient(#fff4d4,#d9b366 60%,#a67a35);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.8))}
.tt-e{font-size:12px;letter-spacing:.55em;padding-left:.55em;color:var(--dim)}
#scTitle .tb{bottom:30px;gap:12px}
.pill{font-size:14px;padding:7px 16px;border-radius:99px;background:rgba(20,12,6,.8);border:1px solid rgba(216,180,106,.4);color:var(--gold2)}
.best{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;text-shadow:0 1px 4px #000}
/* select */
.cards{position:absolute;top:128px;left:14px;right:14px;display:flex;gap:14px}
.card{flex:1;height:440px;border-radius:14px;border:1px solid rgba(216,180,106,.55);background:linear-gradient(rgba(34,22,12,.92),rgba(14,9,5,.95));box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,230,170,.12);display:flex;flex-direction:column;align-items:center;padding-top:14px}
.card:active{transform:scale(.98)}
.card canvas{width:190px;height:210px}
.cn{font-size:34px;letter-spacing:.12em;color:var(--gold2);margin-top:14px}
.ce{font-size:11px;letter-spacing:.4em;color:var(--dim);margin-top:4px}
.cb{font-size:13px;color:var(--dim);margin-top:26px}
.cgo{margin-top:16px;font-size:14px;letter-spacing:.2em;color:#26170a;background:linear-gradient(#ecd08e,#b8893f);border-radius:99px;padding:7px 22px}
.selNote{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:13px;color:var(--dim)}
/* explain */
#exName{position:absolute;left:0;right:0;top:58px;text-align:center;font-size:44px;letter-spacing:.2em;color:var(--gold2);text-shadow:0 2px 10px #000}
#exEn{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:11px;letter-spacing:.5em;color:var(--dim)}
#mEx{position:absolute;left:35px;top:140px;width:380px;height:190px}
.steps{position:absolute;left:16px;right:16px;top:344px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 4px}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;font-size:12px;color:var(--gold2)}
.chip b{width:44px;height:44px;border-radius:50%;border:1px solid rgba(216,180,106,.55);background:rgba(20,12,6,.8);display:flex;align-items:center;justify-content:center}
.chip b svg{width:24px;height:24px}
.arrow{align-self:center;color:var(--gold);font-size:12px;margin-top:-16px}
.tips{position:absolute;left:24px;right:24px;top:476px;font-size:14px;line-height:1.9;text-align:center;color:var(--ink)}
.tips em{font-style:normal;color:var(--gold2);border:1px solid rgba(216,180,106,.6);border-radius:4px;padding:0 5px}
.keys{position:absolute;left:10px;right:10px;top:566px;text-align:center;font-size:11px;color:var(--dim)}
#bGo{position:absolute;left:65px;top:640px}
.limit{position:absolute;left:0;right:0;top:716px;text-align:center;font-size:12px;color:var(--dim)}
/* hud */
#hud{position:absolute;left:10px;top:8px;width:328px;z-index:20}
.hbar{height:46px;border-radius:10px;background:rgba(18,11,6,.82);border:1px solid rgba(216,180,106,.45);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.hbar i{width:1px;height:24px;background:rgba(216,180,106,.4)}
#hDish{font-size:17px;letter-spacing:.08em;color:var(--gold2)}
#hTime,#hScore{font-size:21px;font-variant-numeric:tabular-nums;font-weight:600}
#hTime.warn{color:#ffb38a}
#hPop{font-size:11px;color:var(--dim);margin:3px 0 0 6px}
/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;height:202px;z-index:20;background:linear-gradient(rgba(10,6,3,0),rgba(10,6,3,.78) 30%,rgba(8,5,2,.94))}
#heatRow,#hintRow{position:absolute;left:14px;right:14px;top:12px;height:70px;display:flex;align-items:center;gap:10px;border-radius:12px;background:rgba(22,14,8,.85);border:1px solid rgba(216,180,106,.35);padding:0 12px}
#hintRow{justify-content:center;font-size:17px;color:var(--gold2);letter-spacing:.08em}
.hl{font-size:16px;color:var(--gold2);white-space:nowrap}
.rw{flex:1;position:relative;height:56px}
#heat{position:absolute;left:0;right:0;top:4px;width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
#heat::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2d4468,#a4722e 55%,#c24f22);border:1px solid rgba(0,0,0,.6)}
#heat::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2d4468,#a4722e 55%,#c24f22)}
#heat::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#d6ab58 55%,#8a6424);border:2px solid #2a1a0c;box-shadow:0 3px 8px rgba(0,0,0,.7)}
#heat::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#d6ab58 55%,#8a6424);border:2px solid #2a1a0c}
.ticks{position:absolute;left:10px;right:10px;bottom:0;display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
#heatVal{width:44px;text-align:center;font-size:17px;font-weight:bold;color:#ffd79a}
#heatRow.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{border-color:rgba(243,220,160,.95);box-shadow:0 0 14px rgba(216,180,106,.45)}}
#act{position:absolute;left:35px;top:104px;width:380px;height:80px;font-size:24px;border-radius:16px}
#act svg{width:32px;height:32px}
#act.glow{animation:gl 0.9s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 3px rgba(255,236,180,.55),0 0 22px rgba(255,215,130,.55)}}
/* score */
.sHead{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:18px;letter-spacing:1em;padding-left:1em;color:var(--gold)}
#sDish{position:absolute;left:0;right:0;top:88px;text-align:center;font-size:15px;letter-spacing:.3em;color:var(--dim)}
.sTotal{position:absolute;left:0;right:0;top:404px;text-align:center;color:#fff3d2;text-shadow:0 3px 14px #000}
#sNum{font-size:82px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.sTotal small,.rScore small{font-size:24px;margin-left:4px}
#sRank{position:absolute;left:0;right:0;top:494px;text-align:center;font-size:30px;letter-spacing:.35em;padding-left:.35em;color:var(--gold2);text-shadow:0 2px 10px #000;opacity:0;transition:opacity .5s}
#sRank.on{opacity:1}
.rows{position:absolute;left:56px;right:56px}
#sRows{top:546px}
#sRows,#rRows{left:30px;right:30px}
.row{display:flex;align-items:center;height:24px;font-size:14px;gap:8px;opacity:0;transition:opacity .25s}
.row.on{opacity:1}
.row .n{width:112px;color:var(--dim);white-space:nowrap}
.row .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.row .bar span{display:block;height:100%;background:linear-gradient(90deg,#b8893f,#f3dca0)}
.row .v{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:#fff3d2}
.row .c{width:74px;font-size:11px;color:var(--gold2);white-space:nowrap}
#sNote{position:absolute;left:0;right:0;top:672px;text-align:center;font-size:13px;color:#ffb38a}
#bNext{position:absolute;left:65px;top:704px}
/* grow */
#gStat{position:absolute;left:0;right:0;top:108px;text-align:center;font-size:20px;color:var(--gold2)}
#gSteps{position:absolute;left:0;right:0;top:140px;text-align:center;font-size:13px;color:var(--dim);letter-spacing:.08em}
#gMsg{position:absolute;left:20px;right:20px;top:548px;text-align:center;font-size:19px;line-height:1.5;color:#fff3d2;text-shadow:0 2px 8px #000;letter-spacing:.06em}
#bGrowAct{position:absolute;left:65px;top:626px}
#bGrowNext{position:absolute;left:65px;top:704px}
/* result */
#rDish{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:15px;letter-spacing:.3em;color:var(--dim)}
#mRes{position:absolute;left:75px;top:44px;width:300px;height:124px}
.rScore{position:absolute;left:0;right:0;top:168px;text-align:center;color:#fff3d2}
#rNum{font-size:66px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.new{display:inline-block;font-size:11px;letter-spacing:.1em;color:#26170a;background:linear-gradient(#ecd08e,#b8893f);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:super}
#rRank{position:absolute;left:0;right:0;top:240px;text-align:center;font-size:26px;letter-spacing:.35em;padding-left:.35em;color:var(--gold2)}
#rRows{top:284px}
#rRows .row{opacity:1;height:22px;font-size:13px}
.box{position:absolute;left:30px;right:30px;border-radius:12px;background:rgba(20,12,6,.78);border:1px solid rgba(216,180,106,.35)}
#rPop{top:406px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#rPop .big{font-size:19px;color:var(--gold2)}
#rPop .sm{font-size:11px;color:var(--dim)}
#rBest{position:absolute;left:0;right:0;top:474px;text-align:center;font-size:11px;color:var(--dim);line-height:1.6}
.share{top:512px;height:58px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px}
#rShare{flex:1;font-size:13px;line-height:1.4;color:var(--ink);-webkit-user-select:text;user-select:text}
.btn.mini{min-height:44px;padding:0 12px;font-size:14px;letter-spacing:.05em;border-radius:10px}
.btn.mini svg{width:18px;height:18px}
#bAgain{position:absolute;left:30px;top:584px;width:390px}
.row2{position:absolute;left:30px;right:30px;top:660px;display:flex;gap:12px}
.row2 .btn{flex:1;font-size:17px;letter-spacing:.08em;padding:0 10px}
.btn.stall{background:linear-gradient(#7a2320,#4a1210);border-color:#e6b36a;color:#ffe9bd}
.stallNote{position:absolute;left:0;right:0;top:730px;text-align:center;font-size:12px;color:var(--gold2)}
/* coupon */
.ticket{position:absolute;left:40px;right:40px;top:92px;height:440px;border-radius:16px;background:linear-gradient(160deg,#2c1c0f,#150c06);border:2px solid #d8b46a;box-shadow:0 12px 30px rgba(0,0,0,.7),inset 0 0 0 6px rgba(20,12,6,1),inset 0 0 0 7px rgba(216,180,106,.5);display:flex;flex-direction:column;align-items:center;padding-top:34px;overflow:hidden}
#tkStall{font-size:15px;letter-spacing:.2em;color:var(--dim)}
#tkTitle{font-size:30px;letter-spacing:.12em;color:var(--gold2);margin-top:14px;text-align:center;line-height:1.3}
.tkPop{font-size:64px;margin:18px 0 10px}
#tkNo{font-size:22px;letter-spacing:.12em;color:#fff3d2;font-variant-numeric:tabular-nums}
#tkDate{font-size:12px;color:var(--dim);margin-top:6px}
#tkNote{font-size:13px;color:var(--ink);margin-top:22px;padding:0 20px;text-align:center;line-height:1.6}
.stamp{white-space:nowrap;position:absolute;top:170px;left:50%;transform:translateX(-50%) rotate(-14deg);font-size:54px;letter-spacing:.2em;color:#e0574a;border:5px solid #e0574a;border-radius:10px;padding:0 18px;background:rgba(20,10,6,.6)}
#bCpDone{position:absolute;left:65px;top:560px}
#bStaff{position:absolute;left:65px;top:650px;width:320px;height:52px;border-radius:12px;border:1px dashed rgba(216,180,106,.5);background:rgba(20,12,6,.7);color:var(--dim);font-size:13px;overflow:hidden}
#bStaff .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(216,180,106,.35)}
#bStaff .lbl{position:relative}
#toast{position:absolute;left:0;right:0;top:272px;text-align:center;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#toast span{display:inline-block;font-size:30px;letter-spacing:.25em;padding:10px 26px 10px 32px;border-radius:12px;background:rgba(15,9,5,.88);border:1px solid var(--gold);color:var(--gold2)}
.dimbg{position:absolute;left:0;right:0;top:-300px;bottom:-300px;background:rgba(10,6,3,.55)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="調理画面"></canvas>

  <div id="hud" hidden>
    <div class="hbar"><span id="hDish">オムレツ</span><i></i><span id="hTime" class="sans">2:00</span><i></i><span id="hScore" class="sans">0点</span></div>
    <div id="hPop" class="sans"></div>
  </div>

  <div id="controls" hidden>
    <div id="heatRow"><span class="hl">火加減</span><div class="rw"><input type="range" id="heat" min="0" max="100" step="1" value="0" aria-label="火加減（左で弱火、右で強火）"><div class="ticks sans"><span>弱</span><span>中</span><span>強</span></div></div><span id="heatVal" class="sans">消</span></div>
    <div id="hintRow"></div>
    <button id="act" class="btn gold" aria-label="操作"></button>
  </div>

  <div id="layer">
  <section class="screen" id="scTitle" aria-label="タイトル">
    <div class="center tt"><div class="tt-s">たまご</div><h1 class="tt-m">職人</h1><div class="rule"></div><div class="tt-e">THE EGG ARTISAN</div></div>
    <div class="center tb">
      <div class="pill sans" id="tPop"></div>
      <button class="btn gold wide" id="bStart" data-primary aria-label="はじめる">はじめる</button>
      <button class="btn wide stall" id="bTCoupon" hidden aria-label="割引券を表示">割引券を表示</button>
      <div class="best sans" id="tBest"></div>
    </div>
  </section>

  <section class="screen" id="scSelect" aria-label="料理選択">
    <div class="dimbg"></div>
    <button class="icon-btn back" id="bSelBack" aria-label="タイトルへ戻る"></button>
    <div class="head">料理を選ぶ</div>
    <div class="cards">
      <button class="card" id="cOm" aria-label="オムレツを選ぶ"><canvas id="mOm" data-w="190" data-h="210"></canvas><div class="cn">オムレツ</div><div class="ce">OMELETTE</div><div class="cb sans" id="bestOm"></div><div class="cgo sans">返す</div></button>
      <button class="card" id="cTa" aria-label="卵焼きを選ぶ"><canvas id="mTa" data-w="190" data-h="210"></canvas><div class="cn">卵焼き</div><div class="ce">TAMAGOYAKI</div><div class="cb sans" id="bestTa"></div><div class="cgo sans">巻く</div></button>
    </div>
  </section>

  <section class="screen" id="scExplain" aria-label="料理説明">
    <div class="dimbg"></div>
    <button class="icon-btn back" id="bExBack" aria-label="料理選択へ戻る"></button>
    <div id="exName"></div><div id="exEn"></div>
    <canvas id="mEx" data-w="380" data-h="190"></canvas>
    <div class="steps sans" id="exSteps"></div>
    <div class="tips sans" id="exTips"></div>
    <div class="keys sans" id="exKeys"></div>
    <button class="btn gold wide" id="bGo" data-primary aria-label="スタート">スタート</button>
    <div class="limit sans">制限時間 2:00（卵を溶き始めてから）</div>
  </section>

  <section class="screen" id="scScore" aria-label="採点">
    <div class="sHead">完成</div><div id="sDish"></div>
    <div class="sTotal"><span id="sNum">0</span><small>点</small></div>
    <div id="sRank"></div>
    <div class="rows sans" id="sRows"></div>
    <div id="sNote" class="sans"></div>
    <button class="btn gold wide" id="bNext" data-primary hidden aria-label="次へ">次へ</button>
  </section>

  <section class="screen" id="scGrow" aria-label="ポップコーン育成">
    <div class="head">ポップコーン</div>
    <div id="gStat" class="sans"></div>
    <div id="gSteps" class="sans"></div>
    <div id="gMsg"></div>
    <button class="btn gold wide" id="bGrowAct" data-primary></button>
    <button class="btn wide" id="bGrowNext" data-primary aria-label="結果へ">結果へ</button>
  </section>

  <section class="screen" id="scResult" aria-label="結果">
    <div class="dimbg"></div>
    <div id="rDish"></div>
    <canvas id="mRes" data-w="300" data-h="124"></canvas>
    <div class="rScore"><span id="rNum">0</span><small>点</small><span class="new sans" id="rNew" hidden>NEW</span></div>
    <div id="rRank"></div>
    <div class="rows sans" id="rRows"></div>
    <div class="box sans" id="rPop"></div>
    <div id="rBest" class="sans"></div>
    <div class="box share sans"><span id="rShare"></span><button class="btn mini" id="bCopy" aria-label="結果の文章をコピー"></button></div>
    <button class="btn gold" id="bAgain" data-primary aria-label="もう一度同じ料理に挑戦"></button>
    <div class="row2"><button class="btn" id="bRSel" aria-label="料理選択へ">料理を選ぶ</button><button class="btn stall" id="bStall" hidden aria-label="屋台の割引券を表示"></button></div>
    <div class="stallNote sans" id="stallNote" hidden>🍿 ポップコーン完成！ 屋台で割引券を受け取ろう</div>
  </section>

  <section class="screen" id="scCoupon" aria-label="割引券">
    <div class="dimbg"></div>
    <button class="icon-btn back" id="bCpBack" aria-label="戻る"></button>
    <div class="ticket">
      <div id="tkStall"></div>
      <div id="tkTitle"></div>
      <div class="tkPop" aria-hidden="true">🍿</div>
      <div id="tkNo" class="sans"></div>
      <div id="tkDate" class="sans"></div>

function sizzleStart(){

// オリジナル BGM（行進曲風・Web Audioで合成）
const MEL=[67,72,76,72,79,-1,76,-1,77,76,74,72,74,-1,67,-1,69,74,77,74,81,-1,77,-1,76,79,74,77,72,-1,0,0,

/* ---------- stage & canvas ---------- */
const stage=$('stage'), cv=$('cv'), ctx=cv.getContext('2d');
const minis=[...document.querySelectorAll('canvas[data-w]')];
let scale=1, dpr=1, Hs=800, OY=0;
const bgC=document.createElement('canvas');
function fit(){
  const vw=window.innerWidth, vh=window.innerHeight;
  Hs=Math.round(clamp(W*vh/Math.max(1,vw),H,1000)); OY=(Hs-H)/2;
  scale=Math.min(vw/W,vh/Hs);
  stage.style.height=Hs+'px'; cv.style.height=Hs+'px'; $('layer').style.top=OY+'px';
  stage.style.transform=`scale(${scale})`;
  stage.style.left=((vw-W*scale)/2)+'px';
  stage.style.top=((vh-Hs*scale)/2)+'px';
  dpr=clamp((window.devicePixelRatio||1)*scale,1,3);
  cv.width=Math.round(W*dpr); cv.height=Math.round(Hs*dpr);
  minis.forEach(m=>{const w=+m.dataset.w,h=+m.dataset.h;m.width=Math.round(w*dpr);m.height=Math.round(h*dpr);});
  buildBg(); drawMinis();
}
function buildBg(){
  bgC.width=cv.width; bgC.height=cv.height;
  const c=bgC.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const r=mulberry(7); let y=-10;
  while(y<Hs){
    const h=78+r()*44, base=[40+r()*14,25+r()*9,16+r()*6];
    const g=c.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,rgba(mixc(base,[0,0,0],.3))); g.addColorStop(.5,rgba(base)); g.addColorStop(1,rgba(mixc(base,[0,0,0],.35)));
    c.fillStyle=g; c.fillRect(0,y,W,h);
    for(let i=0;i<28;i++){
      const gy=y+r()*h, amp=1+r()*3.5, fr=.008+r()*.02, ph=r()*6;
      c.strokeStyle=r()<.55?`rgba(8,4,2,${.12+r()*.18})`:`rgba(110,72,40,${.08+r()*.12})`;
      c.lineWidth=.6+r()*1.3; c.beginPath();
      for(let x=0;x<=W;x+=10){const yy=gy+Math.sin(x*fr+ph)*amp;x?c.lineTo(x,yy):c.moveTo(x,yy);} c.stroke();
    }
    c.fillStyle='rgba(0,0,0,.6)'; c.fillRect(0,y+h-1.5,W,1.5); y+=h;
  }
  const lg=c.createRadialGradient(225,330+OY,20,225,380+OY,560+OY);
  lg.addColorStop(0,'rgba(255,205,130,.22)'); lg.addColorStop(.45,'rgba(255,170,80,.06)'); lg.addColorStop(1,'rgba(0,0,0,.78)');
  c.fillStyle=lg; c.fillRect(0,0,W,Hs);
}

/* ---------- drawing: food & tools ---------- */
const EG_RAW=[255,224,112],EG_SET=[250,209,84],EG_DONE=[243,194,66],EG_OVER=[228,184,90];
function eggRGB(C){ if(C<55) return mixc(EG_RAW,EG_SET,clamp(C/55,0,1)); if(C<85) return mixc(EG_SET,EG_DONE,(C-55)/30); return mixc(EG_DONE,EG_OVER,clamp((C-85)/35,0,1)); }

function drawPlate(c,x,y,rx,ry,rect){
  const sp=k=>{ if(rect) rr(c,x-rx*k,y-ry*k,2*rx*k,2*ry*k,Math.min(rx,ry)*.45*k); else {c.beginPath();c.ellipse(x,y,rx*k,ry*k,0,0,TAU);} };
  c.save(); c.shadowColor='rgba(0,0,0,.6)'; c.shadowBlur=26; c.shadowOffsetY=12; c.fillStyle='#e7e2d8'; sp(1); c.fill(); c.restore();

  c.fillStyle=g; sp(1); c.fill();
  g=c.createRadialGradient(x,y+ry*.1,rx*.2,x,y,rx*.8); g.addColorStop(0,'#fcfbf8'); g.addColorStop(.85,'#f0ece4'); g.addColorStop(1,'#d8d1c4');
  c.fillStyle=g; sp(.74); c.fill();
  c.strokeStyle='rgba(190,152,82,.9)'; c.lineWidth=1.6; sp(.93); c.stroke();
  c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=1; sp(.745); c.stroke();
}
function drawPuddle(c,x,y,r,seed){
  if(r<4) return; const rng=mulberry(seed+91), n=14, pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU, k=.7+rng()*.45; pts.push([x+Math.cos(a)*r*k*1.3,y+Math.sin(a)*r*k*.6]);}

  c.fillStyle='rgba(255,212,86,.78)'; c.fill(); c.strokeStyle='rgba(220,160,40,.5)'; c.lineWidth=1; c.stroke();
  c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(x-r*.3,y-r*.15,r*.4,r*.08,-.1,0,TAU); c.fill();
}
function almond(c,a,b,p){ c.beginPath(); c.moveTo(-a,0); c.bezierCurveTo(-a*p,-b*1.28,a*p,-b*1.28,a,0); c.bezierCurveTo(a*p,b*1.36,-a*p,b*1.36,-a,0); c.closePath(); }
function drawOmelette(c,o){
  const a=o.flat?96:100, b=o.flat?52:38, p=o.flat?1:lerp(.98,.6,clamp(o.shape,0,1));
  const base=eggRGB(o.C);
  c.save(); c.shadowColor='rgba(40,20,5,.55)'; c.shadowBlur=12; c.shadowOffsetY=6; almond(c,a,b,p); c.fillStyle=rgba(base); c.fill(); c.restore();

/* ---------- particles ---------- */
const FX=[];
function addFx(o){ if(FX.length<320){ o.life=0; FX.push(o);} }
function updFx(dt){ for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; f.life+=dt; if(f.life>=f.max){FX.splice(i,1);continue;} f.x+=(f.vx||0)*dt; f.y+=(f.vy||0)*dt; f.vy=(f.vy||0)+(f.g||0)*dt; if(f.vr) f.rot+=f.vr*dt; } }
function drawFx(c){
  for(const f of FX){ const k=f.life/f.max;
    if(f.t==='steam'||f.t==='smoke'){ const r=f.s*(1+k*2.2); const col=f.t==='steam'?'255,250,240':'55,50,46'; const a=(f.t==='steam'?.16:.4)*Math.sin(k*Math.PI); const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`); c.fillStyle=g; c.beginPath(); c.arc(f.x,f.y,r,0,TAU); c.fill(); }
    else if(f.t==='spark'){ const a=Math.sin(k*Math.PI), s=f.s*(.6+.4*a); c.save(); c.globalCompositeOperation='lighter'; c.fillStyle=`rgba(255,220,140,${a*.9})`; c.beginPath(); c.moveTo(f.x,f.y-s); c.lineTo(f.x+s*.25,f.y-s*.25); c.lineTo(f.x+s,f.y); c.lineTo(f.x+s*.25,f.y+s*.25); c.lineTo(f.x,f.y+s); c.lineTo(f.x-s*.25,f.y+s*.25); c.lineTo(f.x-s,f.y); c.lineTo(f.x-s*.25,f.y-s*.25); c.closePath(); c.fill(); c.restore(); }
    else if(f.t==='drop'){ c.strokeStyle=`rgba(170,210,255,${.8*(1-k)})`; c.lineWidth=2; c.beginPath(); c.moveTo(f.x,f.y); c.lineTo(f.x-f.vx*.03,f.y-f.vy*.03); c.stroke(); }
    else if(f.t==='pop'){ c.globalAlpha=k>.85?(1-k)/.15:1; drawPopcorn(c,f.x,f.y,f.s,f.rot); c.globalAlpha=1; }
    else if(f.t==='text'){ const a=k<.15?k/.15:1-Math.pow((k-.15)/.85,2); c.save(); c.globalAlpha=clamp(a,0,1); c.font=`bold ${f.s}px ${SERIF}`; c.textAlign='center'; c.textBaseline='middle'; c.lineWidth=5; c.strokeStyle='rgba(20,10,4,.85)'; c.strokeText(f.txt,f.x,f.y); c.fillStyle=f.col||'#f3dca0'; c.fillText(f.txt,f.x,f.y); c.restore(); }
  }
}
function popWord(q,x,y){

  addFx({t:'text',txt:w,x:x||225,y:y||250,vy:-26,max:1.2,s:28,col:q>=.55?'#f7e3a8':'#e8c9a8'});
  if(q>=.85) for(let i=0;i<8;i++) addFx({t:'spark',x:(x||225)+(Math.random()-.5)*120,y:(y||250)+(Math.random()-.5)*50,vy:-20,max:.8,s:8+Math.random()*6});

/* ---------- game state ---------- */
const G={state:'title',time:0,st:0,dish:'omelette',R:null,sc:null,gw:null,cpFrom:'title',staff:-1,cpUsed:false,cd:0};
const P={};
const DISH={omelette:{name:'オムレツ',en:'OMELETTE'},tamago:{name:'卵焼き',en:'TAMAGOYAKI'}};
const IDEAL={omelette:{dish:'omelette',C:80,B:3,Bv:3,shape:1,torn:false,flat:false,layers:0,off:0,seed:11,poured:true},
             tamago:{dish:'tamago',C:74,B:6,Bv:6,shape:1,layers:3,off:0,seed:5,poured:true}};
function newPlay(dish){
  const r=Math.random, sh=Math.round(r()*6-3);
  for(const k of Object.keys(P)) delete P[k];
  Object.assign(P,{dish,phase:'crack',pt:0,t:0,timerOn:false,done:false,timeUp:false,
    seed:(r()*1e9)|0,eggMul:.94+r()*.12,resp:.4+r()*.12,T:20+r()*6,heat:0,
    zone:dish==='omelette'?[55+sh,72+sh]:[48+sh,64+sh],
    cracked:0,crackA:-1,crackSnd:false,wait:0,yolks:[],yolkC:[255,150+r()*40|0,20+r()*25|0],dbl:r()<.2?(r()*3|0):-1,
    mix:0,whA:0,wx:225,wy:400,lastKey:'',whSnd:0,kbWhisk:0,
    melt:0,brownButter:0,cooking:false,heatW:0,heatN:0,C:0,B:0,B1:0,B2:0,burnWarn:0,
    pourT:null,pourPts:null,mixPts:null,flipC:null,flipPts:null,flipped:false,
    shapeQ:[],shapePts:[],tapA:0,cool:0,
    layer:0,layerC:0,layerOn:false,logs:[],rollPts:[],rollDir:0,logSide:0,wrongA:0,
    press:false,fill:0,pressA:0,
    plateOff:null,platePts:null,slideA:0,res:null});
  $('heat').value=0; heatLabel();
}
function goPhase(ph){ P.phase=ph; P.pt=0; P.wait=0; }
function cookRate(){ const f=P.T<=25?0:Math.pow((P.T-25)/45,1.2); return (P.dish==='omelette'?4.0:13)*P.eggMul*f; }
function burnRate(){ let b=Math.max(0,P.T-(P.zone[1]+6))*.9; const C=P.dish==='omelette'?P.C:(P.layerOn?P.layerC:avg(P.logs)); if(C>100) b+=(C-100)*.05; return b; }
function shapeNow(){ return P.dish==='omelette'? .15+sum(P.shapeQ)/3*.85 : .15+sum(P.shapeQ)/2*.85; }
function doneWin(){
  const om=P.dish==='omelette', ph=P.phase;
  if(om){ if(ph==='cook1') return {v:P.C,lo:40,hi:58,l:'返しどき',now:true}; return {v:P.C,lo:70,hi:90,l:'仕上がり',now:false}; }
  if(ph==='cookL') return {v:P.layerC,lo:45,hi:68,l:'巻きどき',now:true};
  return {v:avg(P.logs),lo:62,hi:86,l:'仕上がり',now:false};
}
function buildRes(){
  const om=P.dish==='omelette';
  const vals=P.logs.concat(P.layerOn?[P.layerC]:[]);
  const layers=vals.length, poured=P.pourT!==null;
  const C=om?P.C:avg(vals);
  const B=om?(P.flipped?(P.B1+P.B2)/2:P.B1*.6):P.B;
  return {dish:P.dish,C,B,Bv:om?P.B1:P.B,shape:om?(P.flipped?shapeNow():0):(layers?shapeNow():0),torn:om&&P.flipped&&P.flipC<25,flat:om&&poured&&!P.flipped,layers,off:P.plateOff===null?0:P.plateOff,seed:P.seed,poured};
}
function parts(final){
  const om=P.dish==='omelette';
  const heat=P.heatN>.5?20*Math.min(1,(P.heatW/P.heatN)/.9):0;
  const timing=(P.pourPts||0)+(om?(P.flipPts||0):sum(P.rollPts));
  const shape=(P.mixPts||0)+sum(P.shapePts);
  let done=0; const plate=P.platePts||0;
  if(final&&P.res&&P.res.poured){ const r=P.res, lo=om?70:62, hi=om?90:86; done=30*lin(r.C,lo,hi,32,30)-Math.max(0,r.B-8)*.7; if(r.flat) done*=.6; }
  const mx=[20,30,20,20,10];
  const p=[heat,done,timing,shape,plate].map((v,i)=>clamp(Math.round(v),0,mx[i]));
  return {p,total:sum(p),ratio:P.heatN>.5?P.heatW/P.heatN:0};
}
const rankOf=s=>s>=100?'巨匠':s>=90?'超一流':s>=80?'一流':s>=60?'一人前':s>=40?'新人':'見習い';

/* ---------- actions ---------- */
function startTimer(){ if(P.timerOn) return; P.timerOn=true; bgmStart(); }
function crackEgg(){ if(P.phase!=='crack'||P.crackA>=0||P.cracked>=3) return; P.crackA=0; P.crackSnd=false; }
function whiskAdd(v){ if(P.phase!=='whisk'||P.mix>=100) return; startTimer(); P.mix=Math.min(100,P.mix+v); if(G.time-P.whSnd>.08){P.whSnd=G.time;sfx.whisk();} }
function keyWhisk(k){ if(P.phase!=='whisk') return; whiskAdd(k!==P.lastKey?3.5:1); P.lastKey=k; P.kbWhisk=.5; P.whA+=.9; }
function finishWhisk(){ if(P.phase!=='whisk'||P.mix<60) return; startTimer(); P.mixPts=6*clamp((P.mix-40)/50,0,1); sfx.ok(); popWord(P.mix>=90?1:P.mix>=75?.6:.3,225,300); goPhase('heat'); }
function pourFirst(){ if(P.phase!=='heat') return; const om=P.dish==='omelette'; P.pourT=P.T; const q=lin(P.T,P.zone[0],P.zone[1],15,15); P.pourPts=(om?8:5)*q; P.T-=om?9:7; P.cooking=true; sfx.pour(); popWord(q,225,230);
  if(om) goPhase('cook1'); else { P.layer=0; P.layerC=0; P.layerOn=true; goPhase('cookL'); } }
function flip(){ if(P.phase!=='cook1'||P.pt<1.2) return; P.flipC=P.C; const q=lin(P.C,40,58,22,28); P.flipPts=12*q; P.flipped=true; sfx.flip(); popWord(q,215,200); goPhase('flip'); }
function tapShape(){ if(P.phase!=='shape'||P.dish!=='omelette'||P.shapeQ.length>=3||P.cool>0) return; const pos=tri(P.pt/2); const q=lin(Math.abs(pos),0,.2,1,.6); P.shapeQ.push(q); P.shapePts.push(14/3*q); P.tapA=1; P.cool=.3; sfx.tap(); popWord(q,225,245); }
function roll(dir){ if(P.phase!=='cookL'||P.pt<1) return; const need=P.layer%2===0?-1:1; if(dir&&dir!==need){ P.wrongA=1; return; } const q=lin(P.layerC,45,68,20,25); P.rollPts.push(5*q); P.logs.push(P.layerC); P.layerOn=false; P.rollDir=need; sfx.roll(); popWord(q,225,230); goPhase('rollA'); }
function pourLayer(){ if(P.phase!=='pourWait') return; P.layer++; P.layerC=0; P.layerOn=true; P.T-=6; sfx.pour(); goPhase('cookL'); }
function startPress(){ if(P.phase!=='shape'||P.dish!=='tamago'||P.press||P.shapeQ.length>=2||P.cool>0) return; P.press=true; P.fill=0; sfx.press(); }
function endPress(){ if(!P.press) return; P.press=false; const f=P.fill, q=f>1.08?.12:lin(f,.68,.86,.4,.22); P.shapeQ.push(q); P.shapePts.push(7*q); P.pressA=1; P.cool=.3; sfx.tap(); popWord(q,225,245); }
function plateSwing(){ return P.pt>.5?tri((P.pt-.5)/3)*100:0; }
function plateTap(){ if(P.phase!=='plate'||P.pt<.6||P.plateOff!==null) return; const off=plateSwing(); P.plateOff=off; const q=lin(Math.abs(off),0,16,1,70); P.platePts=10*q; P.cooking=false; P.res=buildRes(); P.slideA=.0001; sfx.plate(); popWord(q,225,380); }
function enterDone(){ if(!P.res) P.res=buildRes(); P.done=true; P.cooking=false; P.press=false; sizzleStop(); bgmStop(); sfx.done(); goPhase('done'); for(let i=0;i<14;i++) addFx({t:'spark',x:225+(Math.random()-.5)*260,y:500+(Math.random()-.5)*140,vy:-15,max:1+Math.random(),s:7+Math.random()*7}); }
function timeUp(){ if(P.done) return; P.timeUp=true; P.cooking=false; P.res=buildRes(); toast('時間切れ'); enterDone(); }
function finish(){
  const pr=parts(true), total=pr.total, R=P.res;
  const prevDish=S.best[P.dish], prevAll=S.best.total;
  S.best[P.dish]=Math.max(prevDish,total); S.best.total=Math.max(prevAll,total);
  G.R={...R,parts:pr.p,total,rank:rankOf(total),ratio:pr.ratio,timeUp:P.timeUp,newBest:total>prevDish&&total>0,high:total>=CONFIG.highScore,dishName:DISH[P.dish].name};
  saveS(); setState('score');
}
function actEnabled(){
  switch(P.phase){
    case 'crack': return P.crackA<0&&P.cracked<3;
    case 'whisk': return P.mix>=60;
    case 'heat': return true;
    case 'cook1': return P.pt>=1.2;
    case 'shape': return P.dish==='omelette'?P.shapeQ.length<3:P.shapeQ.length<2;
    case 'cookL': return P.pt>=1;
    case 'pourWait': return true;
    case 'plate': return P.pt>=.6&&P.plateOff===null;
  } return false;
}
function actPress(){
  if(G.state!=='play'||!actEnabled()) return;
  switch(P.phase){
    case 'crack': crackEgg(); break; case 'whisk': finishWhisk(); break; case 'heat': pourFirst(); break;
    case 'cook1': flip(); break; case 'shape': P.dish==='omelette'?tapShape():startPress(); break;
    case 'cookL': roll(0); break; case 'pourWait': pourLayer(); break; case 'plate': plateTap(); break;
  }
}
function actRelease(){ if(G.state==='play'&&P.dish==='tamago'&&P.phase==='shape') endPress(); }
function swipe(d){ if(G.state!=='play') return; if(d==='up'){ if(P.phase==='cook1') flip(); } else if(P.phase==='cookL') roll(d==='left'?-1:1); }

/* ---------- update ---------- */
function updPlay(dt){
  P.pt+=dt; if(P.cool>0) P.cool-=dt; if(P.tapA>0) P.tapA=Math.max(0,P.tapA-dt*3); if(P.pressA>0) P.pressA=Math.max(0,P.pressA-dt*2.5); if(P.wrongA>0) P.wrongA=Math.max(0,P.wrongA-dt*2); if(P.kbWhisk>0) P.kbWhisk-=dt;
  if(P.timerOn&&!P.done){ P.t+=dt; if(P.t>=CONFIG.timeLimit){ P.t=CONFIG.timeLimit; timeUp(); return; } }
  const ph=P.phase, om=P.dish==='omelette';
  const onFire=['heat','cook1','flip','shape','cookL','rollA','pourWait'].includes(ph);
  if(onFire){ const tgt=18+P.heat*.85; P.T+=(tgt-P.T)*Math.min(1,P.resp*dt); }
  
  if(P.cooking){
    const R=cookRate(), br=burnRate();
    if(om){ P.C+=R*dt; if(!P.flipped) P.B1+=br*dt; else P.B2+=br*dt; }
    else { if(P.layerOn) P.layerC+=R*dt; for(let i=0;i<P.logs.length;i++) P.logs[i]+=R*.1*dt; P.B+=br*dt; }
    if(ph!=='plate'){ P.heatW+=lin(P.T,P.zone[0],P.zone[1],12,12)*dt; P.heatN+=dt; }
    const bNow=om?(P.flipped?P.B2:P.B1):P.B;
    if(br>0&&Math.random()<dt*5) addFx({t:'smoke',x:225+(Math.random()-.5)*160,y:340+(Math.random()-.5)*80,vx:(Math.random()-.5)*10,vy:-30,max:1.8,s:14});
    if(bNow>12&&P.burnWarn<1){ P.burnWarn=1; addFx({t:'text',txt:'▲ 焦げてきた',x:225,y:245,vy:-20,max:1.6,s:24,col:'#ffb38a'}); sfx.burn(); }
    if(bNow>30&&P.burnWarn<2){ P.burnWarn=2; addFx({t:'text',txt:'▲▲ 焦げ！',x:225,y:245,vy:-20,max:1.6,s:26,col:'#ff9a7a'}); sfx.burn(); }
    if(P.T>50&&Math.random()<dt*5*clamp((P.T-45)/40,0,1.3)) addFx({t:'steam',x:225+(Math.random()-.5)*170,y:350+(Math.random()-.5)*90,vx:(Math.random()-.5)*8,vy:-40-Math.random()*20,max:1.6,s:12});
  }
  // sizzle audio
  let lv=0;
  if(P.cooking&&ph!=='plate') lv=clamp((P.T-35)/55,0,1)*.3;
  else if(ph==='plate'&&P.cooking) lv=clamp((P.T-35)/55,0,1)*.15;
  else if(ph==='heat') lv=clamp((P.T-45)/40,0,1)*(om?.12:.07);
  if(lv>0) sizzleStart();
  sizzleSet(lv); if(lv>.05&&Math.random()<dt*lv*25) noise(.02,{f:3000+Math.random()*4000,q:3,g:.08*lv/.3});

  switch(ph){
    case 'crack':
      if(P.crackA>=0){ P.crackA+=dt;
        if(P.crackA>=.22&&!P.crackSnd){ P.crackSnd=true; sfx.crack(); }
        if(P.crackA>=.62){ const idx=P.cracked; const n=idx===P.dbl?2:1; for(let k=0;k<n;k++){ const a=Math.random()*TAU,d=Math.random()*45; P.yolks.push([225+Math.cos(a)*d,404+Math.sin(a)*d*.6]); } P.cracked++; P.crackA=-1; sfx.plop(); if(idx===P.dbl) addFx({t:'text',txt:'双子の黄身！',x:225,y:300,vy:-20,max:1.4,s:22}); }
      } else if(P.cracked>=3){ P.wait+=dt; if(P.wait>.45) goPhase('whisk'); }
      break;
    case 'whisk':
      if(!P.timerOn&&P.pt>3) startTimer();
      if(P.kbWhisk>0){ P.wx=225+Math.cos(P.whA)*48; P.wy=404+Math.sin(P.whA)*28; }
      if(P.mix>=100){ P.wait+=dt; if(P.wait>.35) finishWhisk(); }
      break;
    case 'heat':
      P.melt=clamp(P.melt+dt*Math.max(0,P.T-38)/22,0,1);
      P.brownButter+=dt*Math.max(0,P.T-(P.zone[1]+4))/15;
      break;
    case 'flip': if(P.pt>=.75) goPhase('shape'); break;
    case 'shape':
      if(P.dish==='tamago'&&P.press){ P.fill+=dt/1.4; if(P.fill>1.12) endPress(); }
      if(P.shapeQ.length>=(om?3:2)&&!P.press){ P.wait+=dt; if(P.wait>.5) goPhase('plate'); }
      break;
    case 'rollA':
      if(P.pt>=.9){ P.logSide=P.rollDir; if(P.layer<2) goPhase('pourWait'); else goPhase('shape'); }
      break;
    case 'plate':
      if(P.slideA>0){ P.slideA+=dt; if(P.slideA>=.6) enterDone(); }
      break;
    case 'done':
      if(P.pt>=1.3) finish();
      break;
  }
}
function updScore(dt){

}

function update(dt){
  G.time+=dt; G.st+=dt;
  if(G.state==='countdown'){ const n=3-Math.floor(G.st); if(n!==G.cd&&n>0){ G.cd=n; sfx.beep(); } if(G.st>=3){ sfx.go(); setState('play'); } }
  else if(G.state==='play') updPlay(dt);
  else if(G.state==='score') updScore(dt);
  else if(G.state==='grow') updGrow(dt);
  else if(G.state==='coupon'&&G.staff>=0){ G.staff+=dt; $('staffFill').style.width=clamp(G.staff/1.5*100,0,100)+'%'; if(G.staff>=1.5){ G.staff=-1; useCoupon(); } }
  if(G.state==='title'&&Math.random()<dt*2) addFx({t:'steam',x:225+(Math.random()-.5)*120,y:440,vx:(Math.random()-.5)*6,vy:-30,max:2.4,s:14});
  updFx(dt);
  if(G.state==='play'||G.state==='countdown') updHUD();
}

}

/* ---------- minis ---------- */
function miniBg(c,w,h){ const g=c.createRadialGradient(w/2,h*.55,10,w/2,h/2,w*.7); g.addColorStop(0,'#4a3020'); g.addColorStop(1,'#140c06'); c.fillStyle=g; c.fillRect(0,0,w,h); }
function drawMinis(){
  minis.forEach(m=>{ const c=m.getContext('2d'), w=+m.dataset.w, h=+m.dataset.h; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    if(m.id==='mOm'){ miniBg(c,w,h); drawDish(c,w/2,h/2+4,.54,IDEAL.omelette); }
    else if(m.id==='mTa'){ miniBg(c,w,h); drawDish(c,w/2+6,h/2+4,.54,IDEAL.tamago); }
    else if(m.id==='mEx'){ drawDish(c,w/2,h/2+6,.78,IDEAL[G.dish]); }
    else if(m.id==='mRes'&&G.R){ drawDish(c,w/2,h/2+4,.6,G.R); }
  });
}

/* ---------- events ---------- */
const ptr={id:null,x0:0,y0:0,t0:0,x:0,y:0};
function toBase(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*Hs-OY}; }
function inBowl(p){ return Math.pow((p.x-225)/150,2)+Math.pow((p.y-395)/105,2)<1.25; }
cv.addEventListener('pointerdown',e=>{
  audioInit(); if(G.state!=='play'||ptr.id!==null) return; e.preventDefault();
  ptr.id=e.pointerId; try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toBase(e); ptr.x0=ptr.x=p.x; ptr.y0=ptr.y=p.y; ptr.t0=performance.now();
  switch(P.phase){
    case 'crack': crackEgg(); break;
    case 'whisk': if(inBowl(p)){ whiskAdd(2); P.wx=p.x; P.wy=p.y; } break;
    case 'shape': P.dish==='omelette'?tapShape():startPress(); break;
    case 'plate': plateTap(); break;
  }
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==ptr.id) return; const p=toBase(e), d=Math.hypot(p.x-ptr.x,p.y-ptr.y);
  if(G.state==='play'&&P.phase==='whisk'&&inBowl(p)){ whiskAdd(d*.05); P.whA+=d*.02; P.wx=p.x; P.wy=p.y; }
  ptr.x=p.x; ptr.y=p.y;
});
function ptrEnd(e){
  if(e.pointerId!==ptr.id) return; ptr.id=null; if(G.state!=='play') return;
  const dx=ptr.x-ptr.x0, dy=ptr.y-ptr.y0, dt=performance.now()-ptr.t0;
  if(dt<900&&P.phase!=='whisk'){ if(dy<-40&&Math.abs(dy)>Math.abs(dx)*1.1) swipe('up'); else if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.1) swipe(dx<0?'left':'right'); }
  actRelease();
}
cv.addEventListener('pointerup',ptrEnd); cv.addEventListener('pointercancel',ptrEnd);

const act=$('act');
act.addEventListener('pointerdown',e=>{ e.preventDefault(); audioInit(); act.classList.add('down'); try{act.setPointerCapture(e.pointerId);}catch(_){} actPress(); });
['pointerup','pointercancel'].forEach(ev=>act.addEventListener(ev,()=>{ act.classList.remove('down'); actRelease(); }));
act.addEventListener('click',e=>{ if(e.detail===0&&performance.now()-lastKeyAt>400){ actPress(); setTimeout(actRelease,0); } }); // キーボード／支援技術からの操作

const heat=$('heat');
heat.addEventListener('input',()=>{ heatLabel(); });
heat.addEventListener('pointerup',()=>heat.blur());

let lastKeyAt=-1e9;
document.addEventListener('keydown',e=>{
  audioInit(); const k=e.key; lastKeyAt=performance.now();
  if(G.state==='play'){
    if(k===' '||k==='Enter'){ e.preventDefault(); if(!e.repeat) actPress(); return; }
    if(k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); if(!e.repeat) swipe('up'); return; }
    if(k==='ArrowLeft'||k==='ArrowRight'){ e.preventDefault(); if(e.repeat&&P.phase!=='whisk') return; if(P.phase==='whisk') keyWhisk(k); else swipe(k==='ArrowLeft'?'left':'right'); return; }
    if(k==='q'||k==='Q'||k==='e'||k==='E'||k==='ArrowDown'){ e.preventDefault(); const d=(k==='e'||k==='E')?6:-6; heat.value=clamp(+heat.value+d,0,100); heatLabel(); return; }
    if(k>='0'&&k<='5'){ heat.value=[0,20,40,55,70,90][+k]; heatLabel(); return; }
    return;
  }
  if(G.state==='score'&&(k===' '||k==='Enter')&&!G.sc.ranked){ e.preventDefault(); G.sc.skip=true; return; }
  if(k==='Enter'||k===' '){ const ae=document.activeElement; if(ae&&ae.tagName==='BUTTON') return;
    const scr=document.querySelector('.screen.on'); if(!scr) return; const b=[...scr.querySelectorAll('[data-primary]')].find(x=>!x.hidden); if(b){ e.preventDefault(); b.click(); } }
  if(k==='Escape'&&G.state==='coupon') $('bCpDone').click();
});
document.addEventListener('keyup',e=>{ if(G.state==='play'&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); actRelease(); } });
window.addEventListener('blur',()=>{ actRelease(); ptr.id=null; });
document.addEventListener('visibilitychange',()=>{ if(!A.ctx) return; try{ if(document.hidden) A.ctx.suspend(); else A.ctx.resume(); }catch(e){} });
document.addEventListener('pointerdown',()=>audioInit(),{capture:true});
stage.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,200));

const on=(id,f)=>$(id).addEventListener('click',()=>{ audioInit(); sfx.ui(); f(); });
on('bStart',()=>setState('select'));
on('bTCoupon',()=>setState('coupon'));
on('bSelBack',()=>setState('title'));
on('cOm',()=>{G.dish='omelette';setState('explain');});
on('cTa',()=>{G.dish='tamago';setState('explain');});
on('bExBack',()=>setState('select'));
on('bGo',()=>setState('countdown'));
on('bNext',()=>setState('grow'));
$('scScore').addEventListener('pointerdown',e=>{ if(G.sc&&!G.sc.ranked&&e.target.id!=='bNext') G.sc.skip=true; });
on('bGrowAct',growAct);
on('bGrowNext',()=>setState('result'));
on('bAgain',()=>setState('countdown'));
on('bRSel',()=>setState('select'));
on('bStall',()=>setState('coupon'));
on('bCopy',async()=>{ const ok=await copyText(shareText()); toast(ok?'コピーしました':'コピーできませんでした'); });
const cpBack=()=>setState(G.cpUsed?'title':(G.cpFrom==='result'&&G.R?'result':'title'));
on('bCpBack',cpBack); on('bCpDone',cpBack);
const staff=$('bStaff');
staff.addEventListener('pointerdown',e=>{ e.preventDefault(); if(G.state==='coupon'&&S.coupon) G.staff=0; });
['pointerup','pointercancel','pointerleave'].forEach(ev=>staff.addEventListener(ev,()=>{ if(G.staff>=0){ G.staff=-1; $('staffFill').style.width='0'; } }));
function sndUI(){ $('bSe').innerHTML=svg(S.se?'spk':'spkOff'); $('bSe').setAttribute('aria-pressed',String(S.se)); $('bBgm').innerHTML=svg(S.bgm?'note':'noteOff'); $('bBgm').setAttribute('aria-pressed',String(S.bgm)); }
$('bSe').addEventListener('click',()=>{ audioInit(); S.se=!S.se; applySound(); sndUI(); saveS(); if(S.se) sfx.ui(); });
$('bBgm').addEventListener('click',()=>{ audioInit(); S.bgm=!S.bgm; applySound(); sndUI(); saveS(); });
async function copyText(t){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;left:0;top:0;opacity:0;-webkit-user-select:text;user-select:text'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}

/* ---------- boot ---------- */
[['bSelBack','back'],['bExBack','back'],['bCpBack','back']].forEach(([id,i])=>$(id).innerHTML=svg(i));
$('bCopy').innerHTML=svg('copy')+'コピー'; $('bAgain').innerHTML=svg('retry')+'<span>もう一度</span>'; $('bStall').innerHTML=svg('ticket')+'<span>屋台へ</span>';
loadS(); sndUI(); newPlay('omelette'); fit(); setState('title');
let last=performance.now();
function loop(now){ const dt=Math.min(.1,Math.max(0,(now-last)/1000)); last=now; try{ update(dt); render(); }catch(err){ console.error(err); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__game={G,P,S,setState,actPress,actRelease,swipe,parts}; // テスト用
})();
</script>
</body>
</html>
